name: Android AAB

on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Android SDK packages
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Release keystore
        run: |
          test -f android/keystore/keystore
          cp android/keystore/keystore android/app/release.keystore

      - name: Build release AAB
        working-directory: android
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: satlok
          RELEASE_KEY_ALIAS: satlok
          RELEASE_KEY_PASSWORD: satlok
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: granth-prabandhan-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
